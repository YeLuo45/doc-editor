name: Deploy to GitHub Pages

on:
  push:
    branches: [master, feature/v145-convolver, feature/v155-direction-a-writing-mind, feature/v185-direction-b-agent-forge, master-v153-deploy]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node ./node_modules/.bin/vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
